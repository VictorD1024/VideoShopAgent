[project]
name = "videoshop-agent"
version = "0.1.0"
description = "Content-aware multimodal shopping agent and Agentic RL simulator for short-video e-commerce recommendation."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.0",
  "pyyaml>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
